name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite: $unformatted"
            # Print what it wants, not just which files. On a project without a
            # local toolchain this gate is the only formatter feedback there is,
            # and a bare file list turns a mechanical fix into guesswork.
            gofmt -d $unformatted
            exit 1
          fi
      - run: bash -n clother.sh scripts/install.sh scripts/package-release.sh
      - run: |
          if ls tests/*.sh >/dev/null 2>&1; then
            bash -n tests/*.sh
          fi

  # Windows is a supported platform of this fork, and the only place the
  # Windows-only code paths are ever executed: hardlinks, junctions, the console
  # mode calls, the rename retry. Without this job the port rots silently.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
      - name: Parse the PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in 'scripts/install.ps1', 'clother.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=$file::$($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Package a release
        shell: bash
        env:
          VERSION: 3.6.1-ci.${{ github.sha }}
        run: ./scripts/package-release.sh dist
      - name: Publish the release artifacts for manual testing
        # Only on a pull request: a branch pushed to main is a release, and the
        # artifacts there are the ones the release workflow publishes. This is
        # here so a change can be tried on a real machine without a local Go
        # toolchain, which is how the parts CI cannot reach get checked at all.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: clother-windows
          path: dist/clother_windows_*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Verify OpenRouter launcher and yolo forwarding
        shell: pwsh
        run: |
          Expand-Archive dist/clother_windows_amd64.zip -DestinationPath "$env:RUNNER_TEMP/openrouter-release"
          ./scripts/test-openrouter.ps1 -BinaryPath "$env:RUNNER_TEMP/openrouter-release/clother.exe"

      - name: Install from the packaged release
        shell: pwsh
        run: |
          # Consumes exactly what a release publishes — the zip and the checksum
          # file — through the real installer, into a scratch bin directory.
          $bin = Join-Path $env:RUNNER_TEMP 'clother-bin'
          $env:CLOTHER_RELEASE_BASE_URL = "file:///$((Resolve-Path dist).Path -replace '\\','/')"
          $env:CLOTHER_INSTALL_MODE = 'release'
          $env:CLOTHER_SKIP_SELF_UPDATE = '1'
          # The installer writes the /clother:* commands into the Claude
          # configuration directory. That is pointed at a scratch directory here,
          # both so this step cannot write into the runner's own home and so the
          # assertions below can be made at all.
          $config = Join-Path $env:RUNNER_TEMP 'claude-config'
          $env:CLAUDE_CONFIG_DIR = $config
          ./scripts/install.ps1 -BinDir $bin
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }

          foreach ($name in 'clother.exe', 'clother-zai.exe', 'clother-openrouter.exe', 'clother-kilo.exe', 'clother-or.exe', 'claude.exe') {
            $path = Join-Path $bin $name
            if (-not (Test-Path -LiteralPath $path)) { throw "$name was not created" }
          }
          $commands = Join-Path $config 'commands\clother'
          foreach ($name in 'provider.md', 'config.md', 'status.md', 'usage.md', 'next.md', 'pin.md', 'free.md', 'auto.md') {
            if (-not (Test-Path -LiteralPath (Join-Path $commands $name))) { throw "$name was not written" }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $config 'skills\clother-free-fallback\SKILL.md'))) { throw 'free fallback skill missing' }
          # And nothing reached the real home, which is what the scratch
          # directory above is for.
          if (Test-Path -LiteralPath (Join-Path $env:USERPROFILE '.claude\commands\clother')) {
            throw "the slash commands were written to the real home"
          }

          $clother = Join-Path $bin 'clother.exe'
          # The installed binary has to actually run from where the installer put
          # it. The provider launchers are not exercised here: they insist on a
          # configured provider and a real Claude Code, and the Go tests cover
          # their argv0 dispatch on this same runner.
          & $clother --version
          if ($LASTEXITCODE -ne 0) { throw "clother --version exited $LASTEXITCODE" }
          & $clother list --bin-dir $bin
          if ($LASTEXITCODE -ne 0) { throw "clother list exited $LASTEXITCODE" }
          & $clother update --bin-dir $bin --yes
          if ($LASTEXITCODE -ne 0) { throw "clother update/template refresh exited $LASTEXITCODE" }
          & $clother config budget 1 1
          if ($LASTEXITCODE -ne 0) { throw "budget configuration failed" }
          & $clother uninstall --bin-dir $bin --yes
          if ($LASTEXITCODE -ne 0) { throw "clother uninstall exited $LASTEXITCODE" }
          foreach ($name in 'clother.exe', 'clother-zai.exe', 'claude.exe') {
            if (Test-Path -LiteralPath (Join-Path $bin $name)) { throw "$name survived uninstall" }
          }
          foreach ($name in 'provider.md', 'config.md', 'status.md', 'usage.md', 'next.md', 'pin.md', 'free.md', 'auto.md') {
            if (Test-Path -LiteralPath (Join-Path $commands $name)) { throw "$name survived uninstall" }
          }
          if (Test-Path -LiteralPath $commands) { throw "the command directory survived uninstall" }
